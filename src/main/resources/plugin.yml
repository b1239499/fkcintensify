name: fkcintensify
version: '1.0.0'
main: com.fkc.fkcintensify.FkcIntensifyPlugin
api-version: '1.21'
author: fkc
description: 自訂強化石掉落系統 + 裝備強化系統（可自訂工具對應屬性、降階/損毀機制）

commands:
  fkcintensify:
    description: fkcintensify 主指令
    aliases: [fkci, intensify]
    usage: |
      /fkci reload - 重載設定檔
      /fkci give <玩家> <stone/nodowngrade/nodestroy> [數量] - 給予道具
      /fkci enhance - 強化目前手持的裝備
      /fkci info - 查看目前手持裝備的強化資訊

permissions:
  fkcintensify.admin:
    description: 管理 fkcintensify 的權限（reload、give）
    default: op
  fkcintensify.use:
    description: 使用強化功能的權限
    default: true
