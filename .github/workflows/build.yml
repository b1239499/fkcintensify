name: Build fkcintensify

# 觸發時機：push 到 main 分支，或是手動點擊觸發
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 用 Maven 編譯
        run: mvn -B clean package

      - name: 上傳編譯好的 jar
        uses: actions/upload-artifact@v4
        with:
          name: fkcintensify-jar
          path: target/fkcintensify.jar
          if-no-files-found: error
